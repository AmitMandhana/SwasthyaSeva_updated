name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

      # Generate and lint OpenAPI spec
      - name: Generate Swagger
        run: npm run swagger
        working-directory: backend

      - name: Lint OpenAPI spec
        run: npx spectral lint swagger.json --ruleset .spectral.yaml
        working-directory: backend

      - name: Check Swagger route coverage
        run: node scripts/check-swagger-coverage.js
        working-directory: backend

      - name: Run contract tests (schema validation)
        run: node scripts/contract-test.js
        working-directory: backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx turbo run build

      # Validate E2E test specs
      - name: Validate E2E test specs
        run: node packages/test-gen/dist/generator.js validate

      # Generate E2E tests
      - name: Generate E2E tests
        run: node packages/test-gen/dist/generator.js generate

  e2e:
    name: E2E Tests
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: false  # Disabled until test infrastructure is stable
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build test generator
        run: cd packages/test-gen && npx tsc

      - name: Generate E2E tests
        run: node packages/test-gen/dist/generator.js generate

      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
