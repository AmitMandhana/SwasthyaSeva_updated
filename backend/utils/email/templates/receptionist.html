<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receptionist Access OTP for SwasthyaSeva</title>
    <style>
        body { margin: 0; padding: 0; background: #fafafa; font-family: Arial, sans-serif; }
        .container { max-width: 600px; margin: 20px auto; background: #fafafa; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); overflow: hidden; }
        .header { background: #1976d2; color: #fff; padding: 24px 20px 16px 20px; text-align: center; font-size: 28px; font-weight: bold; }
        .content { padding: 24px 20px; color: #000; font-size: 16px; line-height: 1.6; }
        .otp { font-size: 2em; font-weight: bold; letter-spacing: 2px; margin: 16px 0; text-align: center; }
        .footer { background: #eee; color: #222; text-align: center; padding: 16px 20px; font-size: 13px; }
        @media (max-width: 700px) {
            .container { width: 95% !important; }
            .content, .header { padding-left: 10px; padding-right: 10px; }
        }
        @media (max-width: 480px) {
            .header { font-size: 22px; padding: 18px 8px 10px 8px; }
            .content { font-size: 15px; padding: 16px; }
            .footer { font-size: 12px; padding: 10px 8px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">SwasthyaSeva</div>
        <div class="content">
            <p><b>Receptionist {{receptionist}}</b> at <b>{{center}}</b> is requesting access on your behalf.</p>
            <p>This is your OTP:</p>
            <div class="otp">{{otp}}</div>
            <p>Share it only if you trust them with your account.</p>
        </div>
        <div class="footer">&copy; {{year}} SwasthyaSeva. All rights reserved.</div>
    </div>
</body>
</html>
